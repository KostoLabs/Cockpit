name: Build macOS (Apple Silicon + Intel)

on:
  push:
    tags: ['v*']
    branches: ['claude/**', 'Live']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitaires (client Hermes, renderer, Git)
        run: npm test
      - name: Tests du plugin ctx_handover
        run: python3 -m unittest discover -s plugins/ctx_handover/tests -t plugins

  mac:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build DMG + ZIP (arm64, x64)
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run prebuild
          ARGS="--mac --arm64 --x64 --publish never"
          if [ -n "$CSC_LINK" ]; then
            # Developer ID + notarisation (secrets du dépôt)
            ARGS="$ARGS -c.mac.notarize=true"
          else
            # Sans certificat : signature ad hoc par build/after-pack.js
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            ARGS="$ARGS -c.mac.identity=null"
          fi
          npx electron-builder $ARGS
      - name: Vérification des bundles
        run: |
          for app in dist/mac*/"KostoLabs AI Cockpit.app"; do
            lipo -archs "$app/Contents/MacOS/KostoLabs AI Cockpit"
            codesign --verify --deep --strict "$app" && echo "signature OK : $app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: KostoLabs-AI-Cockpit-mac
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30
      - name: Release GitHub (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --title "KostoLabs AI Cockpit $GITHUB_REF_NAME" \
            --notes-file <(awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{f=1;next}/^## \\[/{f=0}f" CHANGELOG.md) || \
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --clobber
